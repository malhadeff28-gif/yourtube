name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test startup and privacy controls
        run: node --test tests/*.test.js
      - name: Validate starter feed
        run: python3 scripts/validate_feed.py dist/feed.example.json
      - name: Run illustrative relevance evaluation
        run: node evaluation/relevance.js
